<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- SPDX-License-Identifier: GPL-3.0-or-later -->
  <defs>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b7cff"/>
      <stop offset="1" stop-color="#563acc"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="1" stop-color="#ffb020"/>
    </linearGradient>
  </defs>

  <!-- Speech bubble: a post -->
  <path d="M20 6 H72 A16 16 0 0 1 88 22 V62 A16 16 0 0 1 72 78 H36 L20 92 V78 A16 16 0 0 1 4 62 V22 A16 16 0 0 1 20 6 Z" fill="url(#bubble)"/>

  <!-- Image card -->
  <rect x="16" y="17" width="44" height="32" rx="5" fill="#ffffff"/>
  <clipPath id="card"><rect x="16" y="17" width="44" height="32" rx="5"/></clipPath>
  <g clip-path="url(#card)">
    <circle cx="48" cy="26" r="4.5" fill="#ffb020"/>
    <path d="M14 51 L30 31 L41 43 L47 37 L62 51 Z" fill="#563acc"/>
  </g>

  <!-- Text lines: the description -->
  <rect x="16" y="56" width="56" height="6" rx="3" fill="#ffffff"/>
  <rect x="16" y="66" width="36" height="6" rx="3" fill="#ffffff" opacity="0.85"/>

  <!-- AI sparkle -->
  <path d="M77 8 C78.5 19 80 20.5 91 22 C80 23.5 78.5 25 77 36 C75.5 25 74 23.5 63 22 C74 20.5 75.5 19 77 8 Z"
        fill="url(#spark)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
